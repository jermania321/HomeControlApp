name: Python tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0a5c615913e6e843e85d2dfb219ee4e3976f4bc7 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -v
